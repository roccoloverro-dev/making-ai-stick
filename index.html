  /* ---------- adoption chart ---------- */

  function drawAdoption() {
    var box = document.getElementById('adopt-chart');
    if (!box || !lastAnalysis) return;
    var pts = lastAnalysis.series;
    var w = Math.max(300, Math.floor(box.clientWidth)), narrow = w < 560;
    var h = narrow ? 250 : 300;
    var m = { l: 42, r: narrow ? 12 : 128, t: narrow ? 16 : 32, b: 34 };
    var iw = w - m.l - m.r, ih = h - m.t - m.b;
    var X = function (mo) { return m.l + mo / 18 * iw; };
    var Y = function (v) { return m.t + (1 - v) * ih; };
    var css = getComputedStyle(document.documentElement);
    var col = function (v) { return css.getPropertyValue(v).trim(); };
    var s = '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">';
    s += '<rect x="' + X(12) + '" y="' + m.t + '" width="' + (X(18) - X(12)) + '" height="' + ih + '" fill="' + col('--wash') + '"/>';
    [0, 0.25, 0.5, 0.75, 1].forEach(function (v) {
      s += '<line x1="' + m.l + '" x2="' + (m.l + iw) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="' + col('--line') + '" stroke-width="1"/>';
      s += '<text x="' + (m.l - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="11" fill="' + col('--ink-3') + '" style="font-variant-numeric:tabular-nums">' + Math.round(v * 100) + '%</text>';
    });
    [2, 5, 9, 12].forEach(function (mo) {
      s += '<line x1="' + X(mo) + '" x2="' + X(mo) + '" y1="' + m.t + '" y2="' + (m.t + ih) + '" stroke="' + col('--line') + '" stroke-width="1"/>';
    });
    if (!narrow) {
      [[0, 2, 'Prepare'], [2, 5, 'Pilot'], [5, 9, 'Scale'], [9, 12, 'Sustain'], [12, 18, 'Program office closed']].forEach(function (b) {
        s += '<text x="' + ((X(b[0]) + X(b[1])) / 2) + '" y="' + (m.t - 10) + '" text-anchor="middle" font-size="11" fill="' + col('--ink-3') + '">' + b[2] + '</text>';
      });
    }
    pts.forEach(function (p) {
      s += '<text x="' + X(p.month) + '" y="' + (m.t + ih + 20) + '" text-anchor="middle" font-size="11" fill="' + col('--ink-3') + '" style="font-variant-numeric:tabular-nums">' + (p.month === 0 ? 'Month 0' : p.month) + '</text>';
    });
    s += '<line x1="' + m.l + '" x2="' + (m.l + iw) + '" y1="' + Y(D.successRate / 100) + '" y2="' + Y(D.successRate / 100) + '" stroke="' + col('--ink-3') + '" stroke-width="1"/>';
    s += '<text x="' + (m.l + 6) + '" y="' + (Y(D.successRate / 100) - 6) + '" font-size="11" font-weight="600" fill="' + col('--ink-2') + '">Goal ' + D.successRate + '%</text>';
    function path(key) { return pts.map(function (p, i) { return (i ? 'L' : 'M') + X(p.month).toFixed(1) + ' ' + Y(p[key]).toFixed(1); }).join(' '); }
    s += '<path d="' + path('logins') + '" fill="none" stroke="' + col('--s3') + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    s += '<path d="' + path('used') + '" fill="none" stroke="' + col('--s2') + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    s += '<path d="' + path('val') + '" fill="none" stroke="' + col('--s1') + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach(function (p) {
      s += '<circle cx="' + X(p.month) + '" cy="' + Y(p.val) + '" r="4.5" fill="' + col('--s1') + '" stroke="' + col('--bg') + '" stroke-width="2"/>';
    });
    var end = pts[pts.length - 1];
    if (!narrow) {
      s += '<text x="' + (X(18) + 10) + '" y="' + (Y(end.val) + 4) + '" font-size="12.5" font-weight="700" fill="' + col('--ink') + '">' + pct(end.val) + '% meaningful</text>';
    }
    s += '<line id="xhair" x1="0" x2="0" y1="' + m.t + '" y2="' + (m.t + ih) + '" stroke="' + col('--ink-3') + '" stroke-width="1" visibility="hidden"/>';
    s += '<rect id="hit" x="' + m.l + '" y="' + m.t + '" width="' + iw + '" height="' + ih + '" fill="transparent"/>';
    s += '</svg><div class="tip" id="tip" hidden></div>';
    box.innerHTML = s;

    var hit = box.querySelector('#hit'), xh = box.querySelector('#xhair'), tip = box.querySelector('#tip');
    function show(evt) {
      var rect = box.getBoundingClientRect();
      var px = evt.clientX - rect.left;
      var best = pts[0];
      pts.forEach(function (p) { if (Math.abs(X(p.month) - px) < Math.abs(X(best.month) - px)) best = p; });
      xh.setAttribute('x1', X(best.month));
      xh.setAttribute('x2', X(best.month));
      xh.setAttribute('visibility', 'visible');
      tip.innerHTML = '<b>' + (best.month === 0 ? 'Start' : 'Month ' + best.month) + '</b>' +
        '<div><span><i style="background:' + col('--s1') + '"></i>Meaningful use</span><span>' + pct(best.val) + '%</span></div>' +
        '<div><span><i style="background:' + col('--s2') + '"></i>Active use</span><span>' + pct(best.used) + '%</span></div>' +
        '<div><span><i style="background:' + col('--s3') + '"></i>Logins</span><span>' + pct(best.logins) + '%</span></div>';
      tip.hidden = false;
      var left = X(best.month) + 14;
      if (left + 190 > w) left = X(best.month) - 200;
      tip.style.left = Math.max(0, left) + 'px';
      tip.style.top = (m.t + 8) + 'px';
    }
    function hide() { xh.setAttribute('visibility', 'hidden'); tip.hidden = true; }
    hit.addEventListener('pointermove', show);
    hit.addEventListener('pointerdown', show);
    hit.addEventListener('pointerleave', hide);
  }

  /* ---------- summary for copying ---------- */

  function summaryText() {
    var g = ui.game, a = lastAnalysis || S.analyze(g), r = ui.reflection, L = [];
    L.push(D.meta.title + ': my results');
    L.push('Outcome: ' + a.title + '. ' + a.val18 + '% meaningful use at month 18 (goal ' + D.successRate + '%).');
    L.push('Pattern: ' + a.archetype.name);
    L.push('Six Conditions at month 18: ' + S.COND.map(function (id) { return cname(id) + ' ' + S.healthOf(a.cond18[id]).label.toLowerCase(); }).join(', '));
    L.push('Weakest condition: ' + a.weakestName);
    var hits = a.patterns.filter(function (p) { return p.hit; }).map(function (p) { return p.name; });
    L.push('Failure patterns that showed up: ' + (hits.length ? hits.join(', ') : 'none'));
    L.push('');
    L.push('My plan');
    D.phases.forEach(function (p) {
      var plan = g.plans[p.n] || {};
      var items = D.levers.filter(function (l) { return plan[l.id]; }).map(function (l) { return l.name + ' (' + D.levelNames[plan[l.id]] + ')'; });
      L.push('- ' + p.name + ', ' + (g.spend[p.n] || 0) + ' credits: ' + (items.length ? items.join('; ') : 'nothing'));
    });
    ['union', 'headline', 'win', 'sponsor'].forEach(function (id) {
      var e = g.events[id];
      if (!e) return;
      var ev = D.events[id];
      if (e.option === 'auto') { L.push('- Event, ' + ev.title + ': resolved early because the union was engaged in Prepare'); return; }
      var o = ev.options.filter(function (x) { return x.id === e.option; })[0];
      L.push('- Event, ' + ev.title + ': ' + o.label);
    });
    L.push('');
    L.push('What to learn next');
    a.learn.forEach(function (l) { L.push('- ' + l.item.session + '. ' + l.item.focus); });
    L.push('');
    L.push('My bring-back brief');
    L.push('- The condition I\'d strengthen first: ' + (r.fix || '(blank)'));
    L.push('- The failure pattern I\'ve seen for real: ' + (r.pattern || '(blank)'));
    L.push('- One thing I\'ll do in the next 7 days: ' + (r.move || '(blank)'));
    return L.join('\n');
  }

  /* ---------- flow ---------- */

  function render() {
    renderTopbar();
    var html;
    if (ui.view === 'welcome' || !ui.game) html = welcome();
    else if (ui.view === 'case') html = caseScreen();
    else {
      var st = ui.game.stage;
      html = st === 'plan' ? planScreen() : st === 'pulse' ? pulseScreen() : st === 'm18' ? m18Screen() : debriefScreen();
    }
    app.innerHTML = html;
    if (ui.view === 'game' && ui.game && ui.game.stage === 'debrief') drawAdoption();
    save();
  }

  function go() {
    render();
    window.scrollTo(0, 0);
    var h = app.querySelector('h1');
    if (h) { try { h.focus({ preventScroll: true }); } catch (e) { h.focus(); } }
  }

  function newRun() {
    ui.game = S.newGame();
    ui.game.stage = 'plan';
    ui.draft = {};
    ui.choices = {};
    ui.confirm = false;
    ui.recorded = false;
  }

  function setLevel(id, lv) {
    if (lv > 0) ui.draft[id] = lv; else delete ui.draft[id];
    ui.confirm = false;
    updateLever(id);
    updateStatus();
    save();
  }

  var actions = {
    'read-case': function () {
      if (!ui.game || ui.game.stage === 'debrief') newRun();
      ui.view = 'case';
      ui.resetAsk = false;
      go();
    },
    begin: function () { ui.view = 'game'; go(); },
    resume: function () { ui.view = 'game'; ui.resetAsk = false; go(); },
    'ask-reset': function () { ui.resetAsk = true; render(); },
    'cancel-reset': function () { ui.resetAsk = false; render(); },
    reset: function () { ui.game = null; ui.draft = {}; ui.choices = {}; ui.resetAsk = false; ui.view = 'welcome'; go(); },
    home: function () { ui.view = 'welcome'; go(); },
    'to-commit': function () {
      var g = ui.game;
      if (S.planCost(S.cleanPlan(ui.draft, g.phase)) <= g.credits) ui.confirm = true;
      updateStatus();
      var c = document.getElementById('commit');
      if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' });
    },
    commit: function () { ui.confirm = true; updateStatus(); },
    'cancel-commit': function () { ui.confirm = false; updateStatus(); },
    'confirm-commit': function () {
      try {
        S.commitPhase(ui.game, ui.draft);
      } catch (e) {
        ui.confirm = false;
        updateStatus();
        return;
      }
      ui.draft = {};
      ui.choices = {};
      ui.confirm = false;
      go();
    },
    'continue': function () {
      var g = ui.game, err = document.getElementById('continue-err');
      var open = g.pending.filter(function (p) { return !p.resolved; });
      var missing = open.filter(function (p) { return !ui.choices[p.id]; });
      if (missing.length) {
        err.textContent = 'Choose a response to ' + (missing.length > 1 ? 'each event' : 'the event') + ' first.';
        document.getElementById('ev-' + missing[0].id).scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      var total = open.reduce(function (t, p) {
        var o = D.events[p.id].options.filter(function (x) { return x.id === ui.choices[p.id]; })[0];
        return t + o.cost;
      }, 0);
      if (total > g.credits) { err.textContent = 'Those responses cost ' + total + ' credits and you have ' + g.credits + '. Pick a cheaper option.'; return; }
      open.forEach(function (p) { S.resolveEvent(g, p.id, ui.choices[p.id]); });
      S.enterNextPhase(g);
      if (g.stage === 'm18') { S.runMonth18(g); g.stage = 'm18'; }
      ui.choices = {};
      go();
    },
    'to-debrief': function () {
      var g = ui.game;
      g.stage = 'debrief';
      if (!ui.recorded) {
        var a = S.analyze(g);
        ui.attempts.push({ title: a.title, val18: a.val18, spent: a.credits.levers + a.credits.events, archetype: a.archetype.name });
        if (ui.attempts.length > 10) ui.attempts.shift();
        ui.recorded = true;
      }
      go();
    },
    'toggle-table': function (b) {
      var t = document.getElementById('adopt-table');
      t.hidden = !t.hidden;
      b.textContent = t.hidden ? 'Show as a table' : 'Hide the table';
    },
    copy: function () {
      var text = summaryText(), msg = document.getElementById('copy-msg'), fb = document.getElementById('copy-fallback');
      function fallback() {
        msg.textContent = 'Select the text below and copy it.';
        fb.innerHTML = '<textarea class="copy-fallback" readonly aria-label="Your summary">' + esc(text) + '</textarea>';
        var ta = fb.querySelector('textarea');
        ta.focus();
        ta.select();
      }
      try {
        navigator.clipboard.writeText(text).then(function () { msg.textContent = 'Copied. Paste it into your notes, an email, or your workbook.'; }, fallback);
      } catch (e) { fallback(); }
    },
    print: function () { window.print(); },
    replay: function () { newRun(); ui.view = 'game'; go(); }
  };

  app.addEventListener('click', function (e) {
    var set = e.target.closest('[data-set]');
    if (set) { setLevel(set.getAttribute('data-for'), +set.getAttribute('data-set')); return; }
    var b = e.target.closest('[data-action]');
    if (b && actions[b.getAttribute('data-action')]) actions[b.getAttribute('data-action')](b, e);
  });

  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.matches('input[type="range"][data-lever]')) setLevel(t.getAttribute('data-lever'), +t.value);
    else if (t.matches('textarea[data-field]')) { ui.reflection[t.getAttribute('data-field')] = t.value; save(); }
  });

  app.addEventListener('change', function (e) {
    var t = e.target;
    if (!t.matches('input[type="radio"][data-event]')) return;
    var id = t.getAttribute('data-event');
    ui.choices[id] = t.value;
    var p = ui.game.pending.filter(function (x) { return x.id === id; })[0];
    var card = document.getElementById('ev-' + id);
    if (p && card) {
      var tmp = document.createElement('div');
      tmp.innerHTML = eventCard(p);
      card.replaceWith(tmp.firstChild);
      var again = document.querySelector('input[name="ev-' + id + '"][value="' + t.value + '"]');
      if (again) again.focus();
    }
    var err = document.getElementById('continue-err');
    if (err) err.textContent = '';
    save();
  });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(drawAdoption, 150);
  });

  function boot(hotData) {
    if (hotData && hotData.ui) restore(hotData.ui);
    else restore(loadStored());
    render();
  }

  try {
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
