<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Making AI Stick Simulation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A round-by-round change management simulation for the Making AI Stick course, scored on the Six Conditions of Durable Change.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400..800&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered column on plain white, a sticky status bar while playing, cards only for levers and choices.
   Single light theme by design: the course asked for a plain white background throughout. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --ink: #141a22;
  --ink-2: #47505d;
  --ink-3: #66707e;
  --line: #e3e7ed;
  --line-2: #cbd3dd;
  --wash: #f4f6f9;
  --accent: #1c5cab;
  --accent-hover: #164c8f;
  --accent-soft: #eaf1fb;
  --accent-line: #b6cdeb;
  --good: #146c2e;
  --good-dot: #1f9d48;
  --good-soft: #e8f5ec;
  --steady: #3a5a7a;
  --steady-dot: #6f8fae;
  --steady-soft: #edf2f7;
  --warn: #8a5300;
  --warn-dot: #e3a008;
  --warn-soft: #fff5df;
  --risk: #a8241b;
  --risk-dot: #d03b3b;
  --risk-soft: #fdecea;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --lv1: #9ec5f4;
  --lv2: #3987e5;
  --lv3: #184f95;
  --font-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-read: "Merriweather", Georgia, "Times New Roman", serif;
  --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 12px;
  --radius-sm: 8px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--bg);
}
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid rgba(28, 92, 171, 0.4); outline-offset: 2px; border-radius: 4px; }

.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Type */
.eyebrow {
  margin: 0;
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-3);
}
h1, h2, h3 { margin: 0; text-wrap: balance; color: var(--ink); }
h1:focus { outline: none; }
.display {
  font-size: clamp(34px, 6vw, 56px);
  line-height: 1.04;
  font-weight: 800;
  letter-spacing: -0.025em;
}
.title {
  font-size: clamp(28px, 4vw, 40px);
  line-height: 1.1;
  font-weight: 780;
  letter-spacing: -0.02em;
}
h2 { font-size: 22px; line-height: 1.25; font-weight: 720; letter-spacing: -0.01em; }
h3 { font-size: 16px; line-height: 1.35; font-weight: 680; }
p { margin: 0; }
.lead {
  font-family: var(--font-read);
  font-size: 18px;
  line-height: 1.7;
  color: var(--ink-2);
  max-width: 64ch;
}
.read {
  font-family: var(--font-read);
  font-size: 16px;
  line-height: 1.75;
  color: var(--ink);
  max-width: 66ch;
}
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

/* Top bar */
.topbar { border-bottom: 1px solid var(--line); }
.topbar-in {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 58px;
  padding-block: 10px;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-name { font-weight: 800; letter-spacing: -0.01em; font-size: 16px; }
.brand-sub { font-size: 13px; color: var(--ink-3); padding-left: 10px; border-left: 1px solid var(--line-2); }
.facil { font-size: 13px; color: var(--ink-3); }

/* Status bar */
.status {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.status-in {
  display: flex;
  align-items: center;
  gap: 14px 22px;
  padding-block: 10px;
  flex-wrap: wrap;
}
.stepper {
  display: flex;
  gap: 4px;
  flex: 1 1 380px;
  min-width: 0;
  list-style: none;
  margin: 0;
  padding: 0;
}
.stepper li {
  flex: 1 1 0;
  min-width: 0;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-3);
  padding: 4px 0 6px;
  border-bottom: 3px solid var(--line);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stepper li.done { color: var(--ink-2); border-color: var(--lv1); }
.stepper li.current { color: var(--ink); border-color: var(--accent); }
.credits { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.credits-num { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.credits-num.over { color: var(--risk); }
.credits-lab { font-size: 12px; color: var(--ink-3); line-height: 1.25; }
.credits-lab b { color: var(--ink-2); font-weight: 650; }
.gauge { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
.gauge-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-3); }
.gauge-top b { color: var(--ink); font-weight: 650; }
.gauge-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
.gauge-bar span { height: 7px; background: var(--accent-soft); }
.gauge-bar span:first-child { border-radius: 4px 0 0 4px; }
.gauge-bar span:last-child { border-radius: 0 4px 4px 0; }
.gauge.g-light .gauge-bar span:nth-child(-n+1),
.gauge.g-manageable .gauge-bar span:nth-child(-n+2) { background: var(--accent); }
.gauge.g-heavy .gauge-bar span { background: var(--warn-soft); }
.gauge.g-heavy .gauge-bar span:nth-child(-n+3) { background: var(--warn-dot); }
.gauge.g-over .gauge-bar span { background: var(--risk-dot); }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-2);
  background: var(--bg);
  color: var(--ink);
  font-weight: 650;
  font-size: 15px;
  line-height: 1.2;
  cursor: pointer;
  text-decoration: none;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.btn:hover { background: var(--wash); border-color: var(--ink-3); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-quiet { border-color: transparent; color: var(--accent); padding-inline: 10px; }
.btn-quiet:hover { background: var(--accent-soft); border-color: transparent; }
.btn-sm { padding: 8px 12px; font-size: 14px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.err { color: var(--risk); font-size: 14px; font-weight: 600; min-height: 1px; }

/* Screens */
.screen { padding-block: 40px 96px; display: flex; flex-direction: column; gap: 48px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-lg { display: flex; flex-direction: column; gap: 22px; }
.section-head { display: flex; flex-direction: column; gap: 6px; }
.section-head p { color: var(--ink-2); max-width: 68ch; }
.rule { border: 0; border-top: 1px solid var(--line); margin: 0; }

/* Welcome */
.hero { display: flex; flex-direction: column; gap: 22px; padding-top: 24px; }
.facts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.fact { padding: 16px 16px 16px 0; display: flex; flex-direction: column; gap: 2px; }
.fact b { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
.fact span { font-size: 13px; color: var(--ink-3); }
.conds {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
  gap: 0;
  border-top: 1px solid var(--line);
}
.cond-item { display: grid; grid-template-columns: 34px 1fr; gap: 4px 10px; padding: 18px 16px 18px 0; border-bottom: 1px solid var(--line); }
.cond-n { font-family: var(--font-mono); font-size: 13px; color: var(--ink-3); padding-top: 3px; }
.cond-item h3 { font-size: 17px; }
.cond-item p { grid-column: 2; color: var(--ink-2); font-size: 15px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; list-style: none; margin: 0; padding: 0; counter-reset: step; }
.steps li { border-top: 3px solid var(--ink); padding-top: 12px; display: flex; flex-direction: column; gap: 4px; counter-increment: step; }
.steps li::before { content: "Step " counter(step); font-size: 12px; font-weight: 650; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
.steps li p { color: var(--ink-2); font-size: 15px; }
.callout {
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.callout.accent { border-color: var(--accent-line); background: var(--accent-soft); }
.callout.warn { border-color: #f0d49a; background: var(--warn-soft); }
.callout h3 { font-size: 16px; }
.callout p { color: var(--ink-2); }

/* Case */
.case-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 40px; align-items: start; }
.case-side { display: flex; flex-direction: column; gap: 24px; }
.case-block { display: flex; flex-direction: column; gap: 8px; }
.case-block h2 { font-size: 18px; }
.hard { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.hard li { font-family: var(--font-read); font-size: 15.5px; line-height: 1.7; }
.hard b { font-family: var(--font-ui); font-weight: 700; font-size: 15px; }
.gap-line { font-weight: 700; color: var(--ink); }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.person { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.person-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.person h3 { font-size: 15px; }
.person .who { font-size: 12px; color: var(--ink-3); }
.person p { font-size: 14px; color: var(--ink-2); }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.timeline li span:first-child { color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* Chips */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px 3px 8px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 650;
  white-space: nowrap;
  background: var(--wash);
  color: var(--ink-2);
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
.h-strong { background: var(--good-soft); color: var(--good); }
.h-strong .dot { background: var(--good-dot); }
.h-steady { background: var(--steady-soft); color: var(--steady); }
.h-steady .dot { background: var(--steady-dot); }
.h-fragile { background: var(--warn-soft); color: var(--warn); }
.h-fragile .dot { background: var(--warn-dot); }
.h-risk { background: var(--risk-soft); color: var(--risk); }
.h-risk .dot { background: var(--risk-dot); }
.st-resisting { background: var(--risk-soft); color: var(--risk); }
.st-resisting .dot { background: var(--risk-dot); }
.st-skeptical { background: #fcf1ef; color: #9a3b30; }
.st-skeptical .dot { background: #ea9a8f; }
.st-neutral { background: var(--wash); color: var(--ink-2); }
.st-neutral .dot { background: #a3abb6; }
.st-supportive { background: var(--accent-soft); color: var(--accent); }
.st-supportive .dot { background: var(--lv1); }
.st-championing { background: var(--accent-soft); color: var(--accent-hover); }
.st-championing .dot { background: var(--accent); }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--wash); color: var(--ink-2); white-space: nowrap; }

/* Condition health rows */
.health-list { display: flex; flex-direction: column; }
.health-row {
  display: grid;
  grid-template-columns: minmax(120px, 170px) minmax(0, 1fr) auto;
  align-items: center;
  gap: 6px 14px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.health-row .hn { font-weight: 650; font-size: 15px; }
.health-row .hq { font-size: 12.5px; color: var(--ink-3); line-height: 1.35; }
.health-right { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.track { position: relative; height: 12px; background: var(--wash); border-radius: 0 4px 4px 0; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s1); border-radius: 0 4px 4px 0; }
.track .ghost { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: 0.55; }
.track .riskline { position: absolute; top: -5px; bottom: -5px; width: 1px; background: var(--risk-dot); opacity: 0.55; }
.delta { font-size: 12px; font-weight: 650; white-space: nowrap; min-width: 52px; text-align: right; }
.delta.up { color: var(--good); }
.delta.down { color: var(--risk); }
.delta.flat { color: var(--ink-3); }
.mini-conds { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.mini-cond { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.mini-cond b { font-size: 13px; }

/* Plan */
.phase-head { display: flex; flex-direction: column; gap: 12px; }
.live { font-size: 14px; color: var(--ink-2); }
.standing { display: flex; flex-direction: column; gap: 12px; }
.standing-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.standing-top p { font-size: 14px; color: var(--ink-2); }
.move { display: flex; flex-direction: column; gap: 14px; }
.move-head { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.move-head p { color: var(--ink-2); font-size: 14px; }
.lever-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 12px; }
.lever {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--bg);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.lever.on { border-color: var(--accent-line); box-shadow: 0 0 0 1px var(--accent-line); }
.lever-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.lever-cost { text-align: right; white-space: nowrap; line-height: 1.2; }
.lever-cost .cn { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink-3); }
.lever.on .lever-cost .cn { color: var(--accent); }
.lever-cost .cu { display: block; font-size: 11.5px; color: var(--ink-3); }
.lever-short { font-size: 14px; color: var(--ink-2); }
.lever-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-3); }
.lever-meta .sep { width: 1px; height: 14px; background: var(--line-2); margin: 0 4px; }
.lever-level { font-size: 14px; color: var(--ink); min-height: 2.9em; }
.lever-level b { font-weight: 700; }
.lever.off-now .lever-level { color: var(--ink-3); }
.lever-note { font-size: 12px; color: var(--warn); font-weight: 600; }
.slider { display: flex; flex-direction: column; gap: 2px; }
.ticks { display: flex; justify-content: space-between; }
.ticks button {
  border: 0;
  background: none;
  padding: 2px 0;
  font-size: 12px;
  color: var(--ink-3);
  cursor: pointer;
}
.ticks button.sel { color: var(--ink); font-weight: 700; }
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 30px;
  background: transparent;
  margin: 0;
  cursor: pointer;
  --fill: 0%;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(to right, var(--accent) 0 var(--fill), var(--line) var(--fill) 100%);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 22px;
  height: 22px;
  margin-top: -8px;
  border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--accent);
  box-shadow: 0 1px 2px rgba(20, 26, 34, 0.18);
}
input[type="range"].zero::-webkit-slider-thumb { border-color: var(--ink-3); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
input[type="range"]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
input[type="range"]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--accent);
}
input[type="range"].zero::-moz-range-thumb { border-color: var(--ink-3); }
input[type="range"]:focus-visible { outline: none; }
input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(28, 92, 171, 0.3); }
input[type="range"]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px rgba(28, 92, 171, 0.3); }
.closed { font-size: 13px; color: var(--ink-3); }
.closed em { font-style: normal; color: var(--ink-3); }
.commit {
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  padding: 20px 22px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.commit-sum { font-size: 15px; color: var(--ink-2); }
.commit-sum b { color: var(--ink); }

/* Notice */
.notice { border: 1px solid #f0d49a; background: var(--warn-soft); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.notice h2 { font-size: 17px; }
.notice p { color: var(--ink-2); font-size: 15px; }

/* Roadmap and heatmap */
details.roadmap { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; }
details.roadmap summary { cursor: pointer; font-weight: 680; }
details.roadmap[open] summary { margin-bottom: 12px; }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.heat { border-collapse: separate; border-spacing: 2px; width: 100%; min-width: 560px; font-size: 13.5px; table-layout: fixed; }
table.heat col.c-lever { width: 34%; }
table.heat col.c-tot { width: 9%; }
table.heat th { text-align: left; font-weight: 650; color: var(--ink-3); font-size: 12px; padding: 4px 8px; white-space: nowrap; }
table.heat td { padding: 0; }
table.heat td.lname { padding: 6px 8px 6px 0; color: var(--ink); line-height: 1.3; }
table.heat td.tot, table.heat tfoot td { text-align: right; padding: 6px 8px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
table.heat tfoot th, table.heat tfoot td { border-top: 1px solid var(--line); font-weight: 700; color: var(--ink); }
.lvl { display: flex; align-items: center; justify-content: center; height: 30px; border-radius: 4px; font-size: 12px; font-weight: 700; background: var(--wash); color: transparent; }
.lvl-1 { background: var(--lv1); color: #0d2f57; }
.lvl-2 { background: var(--lv2); color: #ffffff; }
.lvl-3 { background: var(--lv3); color: #ffffff; }
.heat-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); align-items: center; }
.heat-legend i { display: inline-block; width: 18px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }

/* Pulse */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }

  var HABIT = [0, 0, 0, 0.25, 0.35, 0.4];
  function potentials(c, n) {
    var all = COND.map(function (id) { return c[id]; });
    var minAll = Math.min.apply(null, all), meanAll = sum(all) / all.length;
    var sVal = 0.55 * minAll + 0.45 * meanAll;
    var u = ['conv', 'cap', 'endo', 'coh', 'adapt'].map(function (id) { return c[id]; });
    var sUsed = 0.35 * Math.min.apply(null, u) + 0.65 * (sum(u) / u.length) + 6 - (HABIT[n || 0] || 0) * Math.max(0, 50 - c.reinf);
    return { sVal: sVal, sUsed: sUsed, val: sigmoid((sVal - 50) / 7), used: sigmoid((sUsed - 44) / 7) };
  }

  function personas(s) {
    var c = s.cond, n = lastPhase(s), out = {};
    var u = cum(s, 'union', 4), imp = cum(s, 'impact', 4), g = cum(s, 'guardrails', 4);
    var grieved = s.grievance || flagPhases(s, 'grievance').length > 0;
    var score = {
      directors: -0.8 + (c.endo - 45) / 18 + (c.adapt - 42) / 20 + (c.coh - 30) / 40 + (cum(s, 'clearPlate', 4) > 0 ? 0.4 : 0) + (s.winAmplified ? 0.3 : 0),
      chiefs: (c.endo - 42) / 18 + 0.35 * lvl(s, 1, 'mgrPreview') + 0.12 * cum(s, 'mgrCoach', 4) + (c.cap - 30) / 40 - ((n >= 2 && lvl(s, 1, 'mgrPreview') === 0) ? 0.6 : 0),
      union: -1 + 0.45 * u + 0.15 * imp + (c.coh - 30) / 50 - (grieved ? 1.2 : 0),
      newer: 0.5 + (c.cap - 22) / 30 + (c.conv - 30) / 40 - (flagPhases(s, 'overloaded').length ? 0.4 : 0),
      veterans: -1.4 + (c.conv - 30) / 22 + 0.12 * cum(s, 'labs', 4) + 0.1 * cum(s, 'champions', 4) + 0.12 * imp + 0.08 * cum(s, 'recognition', 4),
      privacy: -0.2 + (c.coh - 30) / 22 + 0.3 * g - (s.silentHeadline ? 0.8 : 0)
    };
    // Stances have inertia: a group moves at most one step-size per phase toward where conditions point.
    s.pscore = s.pscore || {};
    D.personas.forEach(function (p) {
      var target = clamp(score[p.id], -2, 2);
      var was = s.pscore[p.id] === undefined ? p.start : s.pscore[p.id];
      var v = n === 0 ? p.start : was + clamp(target - was, -D.model.personaStep, D.model.personaStep);
      s.pscore[p.id] = v;
      var st = stanceOf(v);
      out[p.id] = { score: v, key: st.key, label: st.label };
    });
    return out;
  }

  function snapshot(s, month, n, plan) {
    var cov = s.coverage;
    var trained = 0.22 * cum(s, 'elearning', 4) + 0.12 * cum(s, 'labs', 4) + 0.04 * cum(s, 'officehours', 4);
    var nudges = (plan.email || 0) + (plan.elearning || 0);
    return {
      month: month,
      phase: n,
      coverage: cov,
      used: cov * s.rUsed,
      val: cov * s.rVal,
      logins: cov > 0 ? cov * Math.min(0.97, 0.45 + 0.5 * s.rUsed + 0.03 * nudges) : 0,
      training: Math.min(0.98, trained),
      cond: copy(s.cond),
      personas: personas(s)
    };
  }

  function newGame() {
    var cond = {}, floors = {};
    D.conditions.forEach(function (c) { cond[c.id] = c.start; floors[c.id] = c.floor; });
    var s = {
      v: 1, stage: 'welcome', phase: 1, credits: D.budget, frozen: 0, eventCredits: 0,
      cond: cond, floors: floors, rUsed: 0, rVal: 0, coverage: 0, targeting: 1,
      plans: {}, spend: {}, loads: {}, flags: {}, signals: {}, voices: {},
      events: {}, pending: [], notice: null, delay: false, grievance: false,
      silentHeadline: false, winAmplified: false, sponsorHit: 0,
      contrib: {}, contribCond: {}, credSpent: {},
      leak: { mistimed: 0, penalty: 0, items: [] },
      usedVoices: [], history: []
    };
    s.history.push(snapshot(s, 0, 0, {}));
    return s;
  }

  function voiceById(id) {
    for (var i = 0; i < D.voices.length; i++) if (D.voices[i].id === id) return D.voices[i];
    return null;
  }

  function pickVoices(s, n, flags) {
    var c = s.cond, cands = [];
    function add(id, w) { cands.push({ id: id, w: w }); }
    var imp = cum(s, 'impact', n), g = cum(s, 'guardrails', n);
    if (c.conv < 45 && imp < 2) add('job', 50 - c.conv);
    if (c.coh < 45 || (n >= 2 && g === 0)) add('trust', 50 - c.coh);
    if (c.conv < 40) add('before', 40 - c.conv);
    if (n >= 2 && (c.adapt < 45 || c.cap < 40)) add('time', Math.max(45 - c.adapt, 40 - c.cap) + 3);
    if (c.endo < 45 || flags.sponsorDecay) add('leaders', 45 - c.endo + (flags.sponsorDecay ? 10 : 0));
    if (g === 0 && c.coh < 50) add('obligations', 48 - c.coh);
    if (flags.mandateFirst || flags.grievance || flags.overloaded) add('forced', 15);
    if (flags.toolOnly || (n >= 2 && c.cap < 40 && cum(s, 'officehours', n) === 0)) add('once', 12);
    if (flags.managerSkip) add('skip', 18);
    if (flags.fatigue) add('fatigue', 14);
    if (c.conv >= 60) add('pConv', c.conv - 55);
    if (c.cap >= 60) add('pCap', c.cap - 55);
    if (c.endo >= 60) add('pEndo', c.endo - 55);
    if (c.coh >= 60) add('pCoh', c.coh - 55);
    if (c.reinf >= 60) add('pReinf', c.reinf - 55);
    if (c.adapt >= 60 && cum(s, 'clearPlate', n) > 0) add('pAdapt', c.adapt - 55);
    if (n <= 2 && cum(s, 'union', n) >= 2) add('pUnion', 8);
    cands.forEach(function (v) { if (s.usedVoices.indexOf(v.id) >= 0) v.w -= 12; });
    var byW = function (a, b) { return b.w - a.w; };
    var neg = cands.filter(function (v) { return voiceById(v.id).kind === 'neg'; }).sort(byW);
    var pos = cands.filter(function (v) { return voiceById(v.id).kind === 'pos'; }).sort(byW);
    var count = 2 + (lvl(s, n, 'listen') > 0 ? 1 : 0) + (lvl(s, n, 'listen') >= 2 ? 1 : 0);
    var out = [];
    if (neg.length) out.push(neg.shift());
    if (pos.length) out.push(pos.shift());
    var rest = neg.concat(pos).sort(byW);
    while (out.length < count && rest.length) out.push(rest.shift());
    out.forEach(function (v) { s.usedVoices.push(v.id); });
    return out.map(function (v) { return voiceById(v.id); });
  }

  function commitPhase(s, rawPlan) {
    var n = s.phase, ph = D.phases[n - 1];
    var plan = cleanPlan(rawPlan, n);
    var spend = planCost(plan);
    if (spend > s.credits + 1e-9) throw new Error('This plan costs more than the credits you have left.');
    s.credits -= spend;
    s.plans[n] = plan;
    s.spend[n] = spend;

    var c0 = copy(s.cond);
    var li = loadInfo(c0.adapt, plan);
    s.loads[n] = li;
    var lv = function (id) { return plan[id] || 0; };
    var flags = {}, raw = {}, pen = {}, decay = {}, leverRaw = {};
    COND.forEach(function (id) { raw[id] = 0; pen[id] = 0; decay[id] = 0; });

    var absorb = 0.55 + 0.6 * c0.adapt / 100;
    var phaseMult = (n === 2 && s.delay) ? 0.85 : 1;
    var over = li.key === 'over';
    var overMult = over ? Math.max(0.55, 1 - 0.09 * (li.load - li.overload)) : 1;
    var noise = li.extra > 0 ? Math.max(0.7, 1 - 0.035 * li.extra) : 1;
    var fatigue = lv('email') === 3 || (lv('email') + lv('townhall') >= 5);
    var soften = 1 - 0.1 * lv('listen');
    var measured = cum(s, 'dashboard', n) > 0;
    var briefed = cum(s, 'mgrPreview', n) > 0;
    var briefedEarly = lvl(s, 1, 'mgrPreview') > 0;
    var unionCum = cum(s, 'union', n);

    D.levers.forEach(function (l) {
      var level = lv(l.id);
      if (!level) return;
      var fit = l.fit[n - 1], crv = curveOf(l)[level];
      var special = 1;
      if (l.id === 'email' && fatigue) special *= 0.65;
      if (l.id === 'townhall') {
        if (fatigue) special *= 0.65;
        if (!briefed) { special *= 0.6; flags.townhallFirst = true; }
        else if (briefedEarly) special *= 1.15;
      }
      if ((l.id === 'labs' || l.id === 'officehours') && lv('labs') && lv('officehours')) special *= 1.15;
      if (l.id === 'champions' && n > 1 && lvl(s, n - 1, 'champions')) special *= 1.12;
      if (l.id === 'recognition') {
        if (lv('champions')) special *= 1.1;
        if (measured) special *= 1.15;
      }
      if (l.id === 'perfStandards') {
        if (c0.cap < 45) { special *= 0.6; flags.mandateFirst = true; }
        if (unionCum < 2) { special *= 0.8; flags.grievance = true; } else special *= 1.15;
      }
      if (!measured && (l.id === 'recognition' || l.id === 'perfStandards' || l.id === 'mgrCoach')) special *= 0.85;
      if (n >= 2 && !briefedEarly && (l.id === 'mgrCoach' || l.id === 'email' || l.id === 'townhall')) special *= 0.8;
      if (n >= 2 && n <= 3 && cum(s, 'impact', n) === 0 && l.effects.conv) special *= 0.8;

      var drag = overMult * noise * phaseMult * Math.min(1, special);
      var m = crv * fit * absorb * s.targeting * special * overMult * noise * phaseMult * D.model.gain * D.model.phaseGain[n - 1];
      var per = {};
      for (var cid in l.effects) { per[cid] = l.effects[cid] * m; raw[cid] += per[cid]; }
      leverRaw[l.id] = per;

      var credits = l.cost * level;
      s.credSpent[l.id] = (s.credSpent[l.id] || 0) + credits;
      if (fit < 0.85) {
        s.leak.mistimed += credits * (1 - fit);
        s.leak.items.push({ id: l.id, phase: n, kind: 'mistimed', credits: credits * (1 - fit) });
      }
      if (drag < 0.97) {
        s.leak.penalty += credits * (1 - drag);
        s.leak.items.push({ id: l.id, phase: n, kind: 'penalty', credits: credits * (1 - drag) });
      }
    });

    if (fatigue) { pen.conv -= 2.5; flags.fatigue = true; }
    if (flags.townhallFirst) pen.conv -= 2;
    if (over) { pen.conv -= 1.5 * (li.load - li.overload); flags.overloaded = true; }
    if (noise < 0.96) flags.noise = true;
    if (flags.mandateFirst) { pen.conv -= 6; pen.adapt -= 4; }
    if (flags.grievance) pen.coh -= 5;
    if (n >= 3 && lv('sponsor') === 0 && maxLevel(s, 'sponsor', 1, n - 1) >= 2) { pen.endo -= 6; flags.sponsorDecay = true; }
    if (n === 2 && lvl(s, 1, 'mgrPreview') === 0) {
      flags.managerSkip = true;
      pen.endo -= lv('mgrPreview') >= 2 ? 3 : 6;
      pen.conv -= 3;
    }
    if (n === 2 && cum(s, 'impact', 2) === 0) { flags.vagueImpact = true; pen.conv -= 6; }
    if (n === 3 && cum(s, 'impact', 3) === 0) pen.conv -= 4;
    var practice = function (k) { return (lvl(s, k, 'labs') >= 2 ? 1 : 0) + lvl(s, k, 'officehours') + lvl(s, k, 'champions'); };
    if (n >= 2 && lv('elearning') > 0 && practice(n) + (n > 2 ? practice(n - 1) : 0) === 0) { flags.toolOnly = true; pen.conv -= 2; }
    if (n >= 2 && !measured) flags.wrongMetrics = true;

    var reinfNow = sum(REINFORCING.map(lv));
    COND.forEach(function (id) {
      var rate = CDEF[id].decay;
      if (!rate) return;
      if (id === 'endo' && lv('sponsor') === 0) rate *= 1.5;
      if (id === 'reinf' && n >= 3 && reinfNow <= 1) rate *= 1.25;
      decay[id] = rate * D.model.decayScale * ph.len * Math.max(0, c0[id] - s.floors[id]);
    });

    var dAdapt = 0;
    if (li.load > li.comfortable) dAdapt -= (li.load - li.comfortable) * 1.1;
    else dAdapt += 1.2 * (1 - li.load / li.comfortable) * (ph.len / 3);
    dAdapt += 5 * s.rVal * s.coverage * (ph.len / 3);

    var hf = {};
    COND.forEach(function (id) {
      hf[id] = Math.max(0.05, 1 - c0[id] / D.model.headroom);
      var p = pen[id] < 0 ? pen[id] * soften : pen[id];
      var v = c0[id] - decay[id] + raw[id] * hf[id] + p + (id === 'adapt' ? dAdapt : 0);
      s.cond[id] = clamp(v, 0, 100);
    });

    for (var lid in leverRaw) {
      var tot = 0;
      s.contribCond[lid] = s.contribCond[lid] || {};
      for (var cid2 in leverRaw[lid]) {
        var a = leverRaw[lid][cid2] * hf[cid2];
        tot += a;
        s.contribCond[lid][cid2] = (s.contribCond[lid][cid2] || 0) + a;
      }
      s.contrib[lid] = (s.contrib[lid] || 0) + tot;
    }

    if (lv('assess') > 0) s.targeting = Math.max(s.targeting, 1 + 0.04 * lv('assess'));

    // Structural changes outlast the program office: they raise the floor each condition decays toward.
    if (n >= 3) {
      s.floors.coh += 2 * lv('workflow');
      s.floors.reinf += 1.5 * lv('workflow') + (flags.mandateFirst ? 0 : 2 * lv('perfStandards')) + lv('mgrCoach');
      s.floors.endo += 1.2 * lv('mgrCoach');
    }
    if (n === 4) {
      s.floors.cap += lv('champions');
      s.floors.conv += 0.8 * lv('champions') + 0.8 * lv('recognition');
    }
    COND.forEach(function (id) { s.floors[id] = Math.min(s.floors[id], 50); });

    var prevVal = s.coverage * s.rVal;
    var covOld = s.coverage, covNew = ph.coverage;
    if (n === 2 && s.delay) covNew = 0.4;
    if (covNew > covOld && covOld > 0) {
      var f = (covOld + D.model.newCenterStart * (covNew - covOld)) / covNew;
      s.rUsed *= f;
      s.rVal *= f;
    }
    s.coverage = covNew;
    if (covNew > 0) {
      var pot = potentials(s.cond, n);
      s.rUsed += (1 - Math.pow(1 - D.model.usedSpeed, ph.len)) * (pot.used - s.rUsed);
      s.rVal += (1 - Math.pow(1 - D.model.valSpeed, ph.len)) * (pot.val - s.rVal);
      s.rVal = Math.min(s.rVal, s.rUsed);
    }

    var sigs = [];
    WARN_ORDER.forEach(function (k) { if (flags[k]) sigs.push({ key: k, tone: 'warn', text: D.signals[k] }); });
    if (n >= 3 && s.coverage * s.rVal < prevVal - 0.02) sigs.push({ key: 'decaying', tone: 'warn', text: D.signals.decaying });
    var good = [];
    if (n === 2 && s.rVal > 0.35) good.push('goodPilot');
    if (lv('mgrCoach') >= 2) good.push('goodCoaching');
    if (n <= 2 && lv('union') >= 2) good.push('goodUnion');
    if (lv('clearPlate') >= 1) good.push('goodPlate');
    good.forEach(function (k) { sigs.push({ key: k, tone: 'good', text: D.signals[k] }); });
    var warnings = sigs.filter(function (x) { return x.tone === 'warn'; }).slice(0, 3);
    var goods = sigs.filter(function (x) { return x.tone === 'good'; }).slice(0, 4 - warnings.length);
    s.signals[n] = warnings.concat(goods);
    s.flags[n] = flags;
    s.voices[n] = pickVoices(s, n, flags);

    var snap = snapshot(s, ph.end, n, plan);
    snap.visible = { meaningful: measured, sentiment: lv('listen') > 0 };
    s.history.push(snap);

    s.pending = [];
    if (n === 1) {
      if (lv('union') >= 2) {
        s.cond.coh = clamp(s.cond.coh + 3, 0, 100);
        s.events.union = { option: 'auto', cost: 0, fx: { coh: 3 } };
        s.pending.push({ id: 'union', resolved: true, auto: true });
      } else {
        s.pending.push({ id: 'union', resolved: false });
      }
    }
    if (n === 2) {
      s.pending.push({ id: 'headline', resolved: false });
      if (s.rVal >= 0.33 || (s.cond.cap >= 55 && s.cond.conv >= 55)) s.pending.push({ id: 'win', resolved: false });
    }
    if (n === 3) s.pending.push({ id: 'sponsor', resolved: false });
    s.stage = 'pulse';
    return snap;
  }

  // How well the change survives losing its sponsor: a sponsor group and coaching managers spread the backing.
  function coalition(s) {
    var groupPhases = 0;
    for (var k = 1; k <= 3; k++) if (lvl(s, k, 'sponsor') >= 2) groupPhases++;
    var coach = cum(s, 'mgrCoach', 3);
    var cs = (groupPhases >= 2 ? 0.45 : groupPhases === 1 ? 0.2 : 0) +
      (coach >= 3 ? 0.3 : coach >= 1 ? 0.15 : 0) +
      (cum(s, 'champions', 3) >= 3 ? 0.15 : 0);
    return Math.min(0.85, cs);
  }

  function resolveEvent(s, id, optId) {
    var ev = D.events[id], opt = null;
    for (var i = 0; i < ev.options.length; i++) if (ev.options[i].id === optId) opt = ev.options[i];
    if (!opt) throw new Error('Unknown option.');
    if (opt.cost > s.credits + 1e-9) throw new Error('You don\'t have enough credits for that option.');
    s.credits -= opt.cost;
    s.eventCredits += opt.cost;
    var c = s.cond, fx = {};
    function add(k, v) { c[k] = clamp(c[k] + v, 0, 100); fx[k] = (fx[k] || 0) + v; }
    if (id === 'union') {
      if (optId === 'negotiate') { add('coh', 3); add('conv', 1); }
      if (optId === 'proceed') { add('coh', -7); add('conv', -4); s.grievance = true; }
      if (optId === 'delay') { add('coh', 2); s.delay = true; }
    }
    if (id === 'headline') {
      var m = Math.min(1, (cum(s, 'guardrails', 2) / 3) * 0.7 + (c.conv >= 55 ? 0.3 : 0));
      add('conv', -10 * (1 - 0.7 * m));
      add('coh', -5 * (1 - 0.7 * m));
      if (optId === 'qa') { add('conv', 7); add('endo', 3); add('coh', 2); }
      if (optId === 'faq') { add('conv', 3); add('coh', 3); }
      if (optId === 'silent') s.silentHeadline = true;
    }
    if (id === 'win' && optId === 'amplify') { add('conv', 6); add('reinf', 3); s.winAmplified = true; }
    if (id === 'sponsor') {
      var cs = coalition(s);
      s.sponsorHit = 12 * (1 - cs);
      add('endo', -12 * (1 - cs));
      add('conv', -3 * (1 - cs));
      if (optId === 'brief') add('endo', 6);
      if (optId === 'admin') { add('endo', 8); add('conv', 2); }
    }
    s.events[id] = { option: optId, cost: opt.cost, fx: fx };
    s.pending.forEach(function (p) { if (p.id === id) p.resolved = true; });
    var last = s.history[s.history.length - 1];
    last.afterEvents = copy(s.cond);
    return fx;
  }

  function enterNextPhase(s) {
    for (var i = 0; i < s.pending.length; i++) if (!s.pending[i].resolved) throw new Error('Choose a response to the event first.');
    s.pending = [];
    if (s.phase >= 4) { s.stage = 'm18'; return; }
    s.phase += 1;
    s.notice = null;
    if (s.phase === 4) {
      var frozen = Math.round(s.credits * 0.15);
      s.credits -= frozen;
      s.frozen = frozen;
      var hit = (s.cond.adapt >= 60 || lvl(s, 3, 'clearPlate') > 0) ? -2 : -5;
      s.cond.adapt = clamp(s.cond.adapt + hit, 0, 100);
      s.notice = { id: 'cr', frozen: frozen, adapt: hit };
    }
    s.stage = 'plan';
  }

  // Six months after the program office closes. No spending; only what was embedded holds.
  function runMonth18(s) {
    var c = s.cond, before = copy(c);
    var embed = 0.5 * c.reinf / 100 + 0.25 * c.coh / 100 + 0.25 * c.endo / 100;
    var post = Math.max(0.35, 1.45 - 1.3 * embed);
    COND.forEach(function (id) {
      var r = CDEF[id].decay;
      if (!r) return;
      c[id] = clamp(c[id] - r * D.model.decayScale * 6 * post * Math.max(0, c[id] - s.floors[id]), 0, 100);
    });
    c.adapt = clamp(c.adapt + 4 + 10 * s.rVal, 0, 100);
    var pot = potentials(c, 5);
    s.rUsed += (1 - Math.pow(1 - D.model.usedSpeed, 6)) * (pot.used - s.rUsed);
    s.rVal += (1 - Math.pow(1 - D.model.valSpeed, 6)) * (pot.val - s.rVal);
    s.rVal = Math.min(s.rVal, s.rUsed);
    var snap = snapshot(s, 18, 5, {});
    snap.before = before;
    snap.embed = embed;
    s.history.push(snap);
    s.stage = 'debrief';
    return snap;
  }

  function analyze(s) {
    var H = s.history, last = H[H.length - 1];
    var m12 = H.filter(function (h) { return h.month === 12; })[0] || last;
    var pct = function (x) { return Math.round(x * 100); };
    var val18 = pct(last.val);
    var peak = H.reduce(function (a, h) { return h.val > a.val ? h : a; }, H[0]);
    var peakUse = H.reduce(function (a, h) { return h.used > a.used ? h : a; }, H[0]);
    var used18 = pct(last.used);
    var valSlid = pct(peak.val) >= 50 && pct(peak.val) - val18 >= 8;
    var useSlid = pct(peakUse.used) >= 55 && pct(peakUse.used) - used18 >= 12;
    var sortedConds = COND.slice().sort(function (a, b) { return last.cond[a] - last.cond[b]; });
    var weakest = sortedConds[0];
    var minCond = last.cond[weakest];
    var name = function (id) { return CDEF[id].name; };

    var tier;
    if (val18 >= D.successRate && minCond >= D.riskLine) tier = 'stuck';
    else if (val18 >= D.successRate) tier = 'fragile';
    else if (valSlid || useSlid) tier = 'slipped';
    else if (val18 >= 60) tier = 'close';
    else tier = 'stalled';
    var titles = { stuck: 'It stuck', fragile: 'It stuck, barely', slipped: 'It didn\'t stick', close: 'Almost there', stalled: 'It stalled' };
    var summaries = {
      stuck: val18 + '% of caseworkers were still using the assistant meaningfully at month 18, six months after the program office closed. All six conditions held.',
      fragile: val18 + '% meaningful use at month 18, but ' + name(weakest) + ' is at risk. Expect it to slip the next time something else lands on the agency.',
      slipped: valSlid
        ? 'Meaningful use peaked at ' + pct(peak.val) + '% in month ' + peak.month + ' and slid to ' + val18 + '% by month 18. The launch worked. The sustaining didn\'t.'
        : 'Active use peaked at ' + pct(peakUse.used) + '% in month ' + peakUse.month + ' and fell to ' + used18 + '% by month 18, and only ' + val18 + '% ever used it in a way that changed the work. The launch got people to try it. Nothing made it stick.',
      close: val18 + '% meaningful use at month 18. Real progress, but short of the 80% bar. ' + name(weakest) + ' held you back.',
      stalled: 'Meaningful use reached ' + val18 + '% at month 18. The tool is live, but for most caseworkers the work hasn\'t changed.'
    };

    var total = 0, byMove = {}, byPhase = {}, ad = { A: 0, D: 0, K: 0, B: 0, R: 0 }, cells = 0, deep = 0, distinct = {};
    D.moves.forEach(function (m) { byMove[m.id] = 0; });
    for (var n = 1; n <= 4; n++) {
      byPhase[n] = 0;
      var p = s.plans[n] || {};
      for (var id in p) {
        var l = LEV[id], cr = l.cost * p[id];
        total += cr;
        byPhase[n] += cr;
        byMove[l.move] += cr;
        if (l.adkar) ad[l.adkar] += cr;
        cells++;
        if (p[id] >= 2) deep++;
        distinct[id] = true;
      }
    }
    var share = {};
    for (var mv in byMove) share[mv] = total ? byMove[mv] / total : 0;
    var adTotal = ad.A + ad.D + ad.K + ad.B + ad.R;
    var akShare = adTotal ? (ad.A + ad.K) / adTotal : 0;
    var drShare = adTotal ? (ad.D + ad.R) / adTotal : 0;

    var success = tier === 'stuck' || tier === 'fragile';
    var early = total ? (byPhase[1] + byPhase[2]) / total : 0, late = total ? byPhase[4] / total : 0;
    var nDistinct = Object.keys(distinct).length;
    var arch;
    if (success) {
      if (s.credits >= 12) arch = 'lean';
      else if (lvl(s, 1, 'mgrPreview') >= 2 && cum(s, 'mgrCoach', 4) >= 4) arch = 'managers';
      else if (cum(s, 'champions', 4) >= 5 || (cum(s, 'champions', 4) >= 4 && cum(s, 'recognition', 4) >= 3)) arch = 'peers';
      else if (cum(s, 'sponsor', 4) >= 6 && cum(s, 'townhall', 4) >= 2) arch = 'sponsor';
      else if (share.train >= 0.33) arch = 'capability';
      else arch = 'balanced';
    } else {
      if (nDistinct >= 12 && deep <= 3) arch = 'spreadThin';
      else if (early >= 0.62 && late <= 0.12) arch = 'bigLaunch';
      else if (share.communicate >= 0.4) arch = 'broadcaster';
      else if (share.train >= 0.35 && share.reinforce < 0.15) arch = 'trainPray';
      else arch = 'mixed';
    }

    var hits = {};
    var sd = flagPhases(s, 'sponsorDecay');
    if (sd.length) hits.sponsorDecay = 'Showed up in ' + sd.map(function (k) { return D.phases[k - 1].name; }).join(' and ');
    else if (s.events.sponsor && s.events.sponsor.option === 'carry' && s.sponsorHit >= 6) hits.sponsorDecay = 'When your sponsor was reassigned, nobody picked up the role';
    else if (cum(s, 'sponsor', 2) >= 2 && cum(s, 'sponsor', 4) - cum(s, 'sponsor', 2) === 0) hits.sponsorDecay = 'Sponsorship stopped after launch';
    if (lvl(s, 1, 'mgrPreview') === 0) hits.managerSkip = 'Section chiefs weren\'t briefed before launch';
    var practiceTotal = 0;
    for (var k2 = 2; k2 <= 3; k2++) practiceTotal += (lvl(s, k2, 'labs') >= 2 ? 1 : 0) + lvl(s, k2, 'officehours') + lvl(s, k2, 'champions');
    if (flagPhases(s, 'toolOnly').length || (cum(s, 'elearning', 4) >= 2 && practiceTotal <= 1)) hits.toolOnly = 'Courses without practice on real cases';
    if (cum(s, 'impact', 2) === 0) hits.vagueImpact = 'No one said what changes for people\'s jobs before launch';
    if (cum(s, 'dashboard', 3) === 0) hits.wrongMetrics = cum(s, 'dashboard', 4) === 0 ? 'You never measured meaningful use' : 'You measured only logins until Sustain';
    var lateReinf = 0;
    for (var k3 = 3; k3 <= 4; k3++) REINFORCING.forEach(function (id) { lateReinf += lvl(s, k3, id); });
    if (lateReinf <= 3) hits.noReinforcement = 'Little reinforcement in Scale and Sustain';
    var ov = flagPhases(s, 'overloaded');
    if (ov.length) hits.overloaded = 'Workload went over capacity in ' + ov.map(function (k) { return D.phases[k - 1].name; }).join(' and ');
    var patterns = D.patterns.map(function (p) { return { id: p.id, name: p.name, desc: p.desc, hit: !!hits[p.id], where: hits[p.id] || '' }; });
    var nHits = patterns.filter(function (p) { return p.hit; }).length;

    var rows = Object.keys(s.contrib).map(function (id) {
      var cc = s.contribCond[id] || {}, top = null;
      for (var cid in cc) if (!top || cc[cid] > cc[top]) top = cid;
      return { id: id, name: LEV[id].name, credits: s.credSpent[id], gain: s.contrib[id], per: s.contrib[id] / s.credSpent[id], top: top, topName: top ? name(top) : '' };
    });
    var worked = rows.filter(function (r) { return r.credits >= 2; }).sort(function (a, b) { return b.per - a.per; }).slice(0, 3);
    var leakBy = {};
    s.leak.items.forEach(function (it) {
      var key = it.id + ':' + it.kind;
      if (!leakBy[key]) leakBy[key] = { id: it.id, name: LEV[it.id].name, kind: it.kind, credits: 0, phases: [] };
      leakBy[key].credits += it.credits;
      if (leakBy[key].phases.indexOf(it.phase) < 0) leakBy[key].phases.push(it.phase);
    });
    var leaks = Object.keys(leakBy).map(function (k) { return leakBy[k]; }).filter(function (x) { return x.credits >= 1; })
      .sort(function (a, b) { return b.credits - a.credits; }).slice(0, 3);

    var learn = [{ key: weakest, cond: name(weakest), item: D.learning[weakest] }];
    var second = sortedConds[1];
    if (last.cond[second] - minCond <= 6 && last.cond[second] < 70) learn.push({ key: second, cond: name(second), item: D.learning[second] });
    if (nHits >= 2) learn.push({ key: 'patterns', cond: '', item: D.learning.patterns });
    else if (akShare >= 0.55) learn.push({ key: 'adkar', cond: '', item: D.learning.adkar });
    learn = learn.slice(0, 3);

    var leverRows = D.levers.filter(function (l) { return cum(s, l.id, 4) > 0; }).map(function (l) {
      return { id: l.id, name: l.name, move: l.move, levels: [1, 2, 3, 4].map(function (k) { return lvl(s, k, l.id); }), credits: s.credSpent[l.id] || 0 };
    });

    return {
      tier: tier, title: titles[tier], summary: summaries[tier], success: success,
      val18: val18, used18: used18, logins18: pct(last.logins), val12: pct(m12.val),
      peakVal: pct(peak.val), peakMonth: peak.month, peakUsed: pct(peakUse.used), peakUsedMonth: peakUse.month,
      weakest: weakest, weakestName: name(weakest), minCond: minCond,
      cond18: last.cond, cond12: m12.cond, condStart: H[0].cond,
      series: H.map(function (h) { return { month: h.month, val: h.val, used: h.used, logins: h.logins, coverage: h.coverage }; }),
      archetype: { key: arch, name: D.archetypes[arch].name, read: D.archetypes[arch].read },
      patterns: patterns, patternHits: nHits,
      worked: worked, leaks: leaks,
      byMove: byMove, share: share, byPhase: byPhase, total: total,
      adkar: ad, akShare: akShare, drShare: drShare,
      learn: learn, nextMove: D.learning[weakest].monday,
      leverRows: leverRows,

      events: s.events

  }

  root.SIM = {
    newGame: newGame,
    available: available,
    availability: availability,
    cleanPlan: cleanPlan,
    planCost: planCost,
    loadInfo: loadInfo,
    potentials: potentials,
    commitPhase: commitPhase,
    resolveEvent: resolveEvent,

<script>
/* Making AI Stick Simulation: screens and interaction. Reads SIM_DATA, drives the SIM engine. */
(function () {

  /* ---------- storage ---------- */

  }
  function restore(obj) {

      if (obj[k] !== undefined && obj[k] !== null) ui[k] = obj[k];
    });

  /* ---------- helpers ---------- */

  };

  function timeDemand(l) {

    }
    return '<div class="wrap status-in">' + html + '</div>';
  }
  function statusBar() { return '<div class="status" id="status" role="region" aria-label="Simulation status">' + statusInner() + '</div>'; }

  /* ---------- welcome ---------- */

  function welcome() {
    var g = ui.game;
    var finished = g && (g.stage === 'debrief');

    } else if (inProgress) {

      acts = '<div class="actions"><button class="btn btn-primary" data-action="resume">' + esc(where) + '</button>' +
        '<button class="btn btn-quiet" data-action="read-case">Reread the case</button>' +

    } else if (finished) {

      acts = '<div class="actions"><button class="btn btn-primary" data-action="read-case">Read the case</button></div>';

    var conds = D.conditions.map(function (c, i) {
      return '<div class="cond-item"><span class="cond-n">0' + (i + 1) + '</span><h3>' + esc(c.name) + '</h3><p>' + esc(c.question) + '</p></div>';
    }).join('');
    return '<main class="wrap screen">' +
      '<section class="hero">' +
        '<p class="eyebrow">' + esc(D.meta.course) + ' · Adoption simulation</p>' +

        acts +
      '</section>' +
      '<div class="facts">' +

  function healthRows(cond, opts) {

          '<div class="case-block"><h2>Why now</h2><p class="read">' + esc(C.whyNow) + '</p></div>' +
          '<div class="case-block"><h2>What makes it hard</h2><ul class="hard">' + C.hard.map(function (h) { return '<li><b>' + esc(h.label) + '.</b> ' + esc(h.text) + '</li>'; }).join('') + '</ul></div>' +
        '</div>' +
        '<aside class="case-side">' +
          '<div class="case-block"><h2>Where the Six Conditions start</h2>' + healthRows(startConds, { notes: true }) + '</div>' +
          '<div class="case-block"><h2>Your resources</h2><p class="read">' + D.budget + ' change credits for the year: the money, staff time, and leadership attention you can direct. Credits you don\'t spend carry forward.</p></div>' +

      '</div>' +
      '<section class="stack-lg"><div class="section-head"><h2>The people</h2><p>Where each group starts on the influence and resistance map. Their stance moves with what you do.</p></div><div class="people">' + people + '</div></section>' +
      '<p class="muted small">' + esc(C.privateNote) + '</p>' +
      '<div class="actions">' + cta + '</div>' +
    '</main>';
  }

  /* ---------- plan ---------- */

  function leverCard(l, n) {
    var lv = ui.draft[l.id] || 0, av = S.availability(l, n);
    var tags = builds(l).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
    return '<article class="lever' + (lv ? ' on' : ' off-now') + '" id="card-' + l.id + '">' +
      '<div class="lever-top"><h3>' + esc(l.name) + '</h3><div class="lever-cost"><span class="cn" id="cost-' + l.id + '">' + (l.cost * lv) + '</span><span class="cu" id="unit-' + l.id + '">' + unitText(l, lv) + '</span></div></div>' +
      '<p class="lever-short">' + esc(l.short) + '</p>' +
      '<div class="lever-meta"><span>Builds</span>' + tags + '<span class="sep"></span><span>Time demand: ' + timeDemand(l) + '</span></div>' +
      (l.extra ? '<p class="lever-short">' + esc(l.extra) + '</p>' : '') +
      '<div class="slider"><input type="range" min="0" max="3" step="1" value="' + lv + '" data-lever="' + l.id + '" id="sl-' + l.id + '" class="' + (lv ? '' : 'zero') + '" style="--fill:' + (lv / 3 * 100) + '%" aria-label="' + esc(l.name) + ' level" aria-valuetext="' + esc(D.levelNames[lv] + ': ' + l.levels[lv]) + '">' +
      '<div class="ticks" aria-hidden="true">' + D.levelNames.map(function (nm, i) { return '<button type="button" tabindex="-1" data-set="' + i + '" data-for="' + l.id + '" class="' + (i === lv ? 'sel' : '') + '">' + nm + '</button>'; }).join('') + '</div></div>' +
      '<p class="lever-level" id="desc-' + l.id + '"><b>' + D.levelNames[lv] + '.</b> ' + esc(l.levels[lv]) + '</p>' +
      (av.note ? '<p class="lever-note">' + esc(av.note) + '</p>' : '') +
    '</article>';
  }

  function creditsWord(n) { return n === 1 ? 'credit' : 'credits'; }
  function unitText(l, lv) { return creditsWord(l.cost * lv) + ' · ' + l.cost + ' per level'; }

  function updateLever(id) {
    var l = S.LEV[id], lv = ui.draft[id] || 0;
    var card = document.getElementById('card-' + id);
    if (!card) return;
    card.className = 'lever' + (lv ? ' on' : ' off-now');
    document.getElementById('cost-' + id).textContent = l.cost * lv;
    document.getElementById('unit-' + id).textContent = unitText(l, lv);
    document.getElementById('desc-' + id).innerHTML = '<b>' + D.levelNames[lv] + '.</b> ' + esc(l.levels[lv]);
    var sl = document.getElementById('sl-' + id);
    sl.value = lv;
    sl.className = lv ? '' : 'zero';
    sl.style.setProperty('--fill', (lv / 3 * 100) + '%');
    sl.setAttribute('aria-valuetext', D.levelNames[lv] + ': ' + l.levels[lv]);
    var ticks = card.querySelectorAll('.ticks button');
    for (var i = 0; i < ticks.length; i++) ticks[i].className = i === lv ? 'sel' : '';
  }

  function commitInner() {
    var g = ui.game, n = g.phase;
    var plan = S.cleanPlan(ui.draft, n), cost = S.planCost(plan), left = g.credits - cost;
    var li = S.loadInfo(g.cond.adapt, plan), count = Object.keys(plan).length;
    var after = n < 4
      ? 'After this phase you\'ll have <b>' + left + ' credits</b> for ' + plural(4 - n, 'more phase', 'more phases') + '.'
      : 'You\'ll finish with <b>' + left + ' credits</b> unspent.';
    var sum = '<p class="commit-sum">This phase: <b>' + plural(count, 'activity', 'activities') + '</b>, <b>' + cost + ' credits</b>, workforce load <b>' + li.label + '</b>. ' + after + '</p>';
    if (li.extra > 0) sum += '<p class="commit-sum">You\'re running ' + count + ' activities at once. Past ' + D.model.focusLimit + ', the message starts to blur.</p>';
    var btns;
    if (left < 0) {
      btns = '<p class="err">You\'re ' + (-left) + ' credits over budget. Dial something down before you commit.</p>';
    } else if (ui.confirm) {
      btns = '<p class="commit-sum"><b>Lock in ' + esc(phase(n).name) + '?</b> Once it\'s committed, you can\'t change it.' + (count === 0 ? ' You haven\'t chosen any activities for this phase.' : '') + '</p>' +
        '<div class="actions"><button class="btn btn-primary" data-action="confirm-commit">Lock it in</button><button class="btn" data-action="cancel-commit">Keep editing</button></div>';
    } else {
      btns = '<div class="actions"><button class="btn btn-primary" data-action="commit">Commit ' + esc(phase(n).name) + '</button></div>';
    }
    return '<h2>Ready to commit?</h2>' + sum + btns;
  }

  function updateStatus() {
    var st = document.getElementById('status');
    if (st) st.innerHTML = statusInner();
    var cm = document.getElementById('commit');
    if (cm) cm.innerHTML = commitInner();
  }

  function standing(g) {
    var n = g.phase, last = g.history[g.history.length - 1];
    var mini = D.conditions.map(function (c) {
      return '<div class="mini-cond"><b>' + esc(c.name) + '</b>' + healthChip(g.cond[c.id]) + '</div>';
    }).join('');
    var metrics = '';
    if (n >= 2 && last.coverage > 0) {
      var see = measured(g, n - 1);
      metrics = '<p>Month ' + last.month + ': ' + pct(last.coverage) + '% deployed · active use ' + (see ? pct(last.used) + '%' : 'not measured') +
        ' · meaningful use ' + (see ? pct(last.val) + '%' : 'not measured') + ' · logins ' + pct(last.logins) + '%</p>';
    }
    return '<section class="standing"><div class="standing-top"><h2>Where things stand</h2>' + metrics + '</div><div class="mini-conds">' + mini + '</div></section>';
  }

  function roadmap(g) {
    if (g.phase < 2) return '';
    return '<details class="roadmap"><summary>Your plan so far</summary>' + heatTable(g, g.phase - 1) + '</details>';
  }

  function planScreen() {
    var g = ui.game, n = g.phase, ph = phase(n);
    var notice = '';
    if (g.notice && g.notice.id === 'cr' && n === 4) {
      notice = '<section class="notice"><p class="eyebrow">Event</p><h2>' + esc(D.events.cr.title) + '</h2><p>' + esc(D.events.cr.text) + '</p>' +
        '<p><b>' + g.notice.frozen + ' credits were frozen.</b> The recertification also costs people time, so Adaptive Capacity took a hit.</p></section>';
    }
    var moves = D.moves.map(function (m) {
      var open = D.levers.filter(function (l) { return l.move === m.id && S.available(l, n); });
      var closed = D.levers.filter(function (l) { return l.move === m.id && !S.available(l, n); });
      return '<section class="move" aria-labelledby="mv-' + m.id + '"><div class="move-head"><h2 id="mv-' + m.id + '">' + esc(m.name) + '</h2><p>' + esc(m.purpose) + '</p></div>' +
        (open.length ? '<div class="lever-grid">' + open.map(function (l) { return leverCard(l, n); }).join('') + '</div>' : '<p class="closed">Nothing in this move is available in this phase.</p>') +
        (closed.length ? '<p class="closed">Not available now: ' + closed.map(function (l) { return esc(l.name) + ' <em>(' + esc(S.availability(l, n).note) + ')</em>'; }).join(' · ') + '</p>' : '') +
      '</section>';
    }).join('');
    return statusBar() + '<main class="wrap screen">' +
      '<div class="phase-head"><p class="eyebrow">Phase ' + n + ' of 4 · ' + esc(ph.months) + '</p><h1 class="title" tabindex="-1">' + esc(ph.name) + '</h1>' +
      '<p class="lead">' + esc(ph.intro) + '</p><p class="live"><b>Live now:</b> ' + esc(ph.live) + '</p></div>' +
      notice + standing(g) + roadmap(g) + moves +
      '<section class="commit" id="commit">' + commitInner() + '</section>' +
    '</main>';
  }

  /* ---------- pulse ---------- */

  function sentiment(c) {
    var v = 0.6 * c.conv + 0.2 * c.adapt + 0.2 * c.endo;
    return v < 40 ? 'Mostly negative' : v < 55 ? 'Mixed' : v < 70 ? 'Leaning positive' : 'Positive';
  }

  function tile(label, value, sub, cls, tag) {
    return '<div class="tile ' + (cls || '') + '"><div class="tl"><span>' + label + '</span>' + (tag ? '<span class="watch-tag">' + tag + '</span>' : '') + '</div><div class="tv num">' + value + '</div><div class="ts">' + sub + '</div></div>';
  }

  function eventCard(p) {
    var ev = D.events[p.id], g = ui.game;
    if (p.auto) {
      return '<section class="event done"><p class="eyebrow">Event</p><h2>' + esc(ev.resolvedTitle) + '</h2><p class="event-text">' + esc(ev.resolvedText) + '</p></section>';
    }
    var chosen = ui.choices[p.id];
    var others = 0;
    g.pending.forEach(function (q) {
      if (q.id !== p.id && !q.resolved && ui.choices[q.id]) {
        var o = D.events[q.id].options.filter(function (x) { return x.id === ui.choices[q.id]; })[0];
        if (o) others += o.cost;
      }
    });
    var opts = ev.options.map(function (o) {
      var afford = o.cost <= g.credits - others;
      var sel = chosen === o.id;
      return '<label class="option' + (sel ? ' sel' : '') + (afford ? '' : ' disabled') + '">' +
        '<input type="radio" name="ev-' + p.id + '" value="' + o.id + '"' + (sel ? ' checked' : '') + (afford ? '' : ' disabled') + ' data-event="' + p.id + '">' +
        '<span class="oc">' + (o.cost ? o.cost + ' ' + creditsWord(o.cost) : 'No cost') + (afford ? '' : ' · not enough credits') + '</span>' +
        '<span class="ol">' + esc(o.label) + '</span><span class="od">' + esc(o.detail) + '</span></label>';
    }).join('');
    return '<section class="event" id="ev-' + p.id + '"><p class="eyebrow">Event</p><h2>' + esc(ev.title) + '</h2><p class="event-text">' + esc(ev.text) + '</p>' +
      '<fieldset style="border:0;margin:0;padding:0"><legend class="muted small" style="margin-bottom:8px">How do you respond?</legend><div class="options">' + opts + '</div></fieldset></section>';
  }

  function pulseScreen() {
    var g = ui.game, n = g.phase, ph = phase(n);
    var snap = g.history[g.history.length - 1], prev = g.history[g.history.length - 2];
    var see = snap.visible && snap.visible.meaningful;
    var tiles = tile('Deployed', pct(snap.coverage) + '%', 'of caseworkers have the tool');
    tiles += see ? tile('Active use', pct(snap.used) + '%', 'used it on a case in the last two weeks')
      : tile('Active use', 'Not measured', 'Fund the early-warning dashboard to see it', 'fogged');
    tiles += see ? tile('Meaningful use', pct(snap.val) + '%', 'drafts used on real cases and approved')
      : tile('Meaningful use', 'Not measured', 'Fund the early-warning dashboard to see it', 'fogged');
    tiles += tile('Logins', pct(snap.logins) + '%', 'logged in this month', 'watch', 'Watchlist');
    tiles += tile('Course completions', pct(snap.training) + '%', 'finished assigned training', 'watch', 'Watchlist');
    var sentTile = (snap.visible && snap.visible.sentiment) ? tile('Sentiment pulse', '<span style="font-size:20px">' + sentiment(snap.cond) + '</span>', 'from this phase\'s pulse surveys') : '';
    tiles += sentTile;
    var fogNote = see ? '' : '<p class="muted small">You can see logins and course completions. You can\'t yet see whether drafts are being used on real cases.</p>';
    var adoption = snap.coverage > 0
      ? '<section class="stack"><h2>Adoption</h2><div class="tiles">' + tiles + '</div>' + fogNote + '</section>'
      : '<section class="stack"><h2>Adoption</h2><p class="muted">Nothing is live yet. The two pilot centers switch on in month 3.</p>' + (sentTile ? '<div class="tiles">' + sentTile + '</div>' : '') + '</section>';

    var people = D.personas.map(function (p) {
      var now = snap.personas[p.id], was = prev.personas[p.id];
      var d = now.score - was.score;
      var mv = d >= 0.25 ? '<span class="delta up">↑</span>' : d <= -0.25 ? '<span class="delta down">↓</span>' : '<span class="delta flat"></span>';
      return '<div class="persona-row"><div><div class="pn">' + esc(p.name) + '</div><div class="pq">' + esc(p.quadrant) + '</div></div><div class="persona-right">' + mv + stanceChip(now) + '</div></div>';
    }).join('');

    var voices = (g.voices[n] || []).map(function (v) {
      return '<figure class="voice' + (v.kind === 'pos' ? ' pos' : '') + '"><p>“' + esc(v.text) + '”</p><cite>' + esc(v.who) + '</cite></figure>';
    }).join('');
    var sigs = (g.signals[n] || []).map(function (s) {
      return '<li>' + (s.tone === 'good' ? ICON.good : ICON.warn) + '<span>' + esc(s.text) + '</span></li>';
    }).join('');

    var events = g.pending.map(eventCard).join('');
    var nextLabel = n < 4 ? 'Plan ' + phase(n + 1).name : 'Fast-forward to month 18';
    return statusBar() + '<main class="wrap screen">' +
      '<div class="phase-head"><p class="eyebrow">Pulse check · Month ' + snap.month + '</p><h1 class="title" tabindex="-1">After ' + esc(ph.name.toLowerCase()) + '</h1></div>' +
      adoption +
      '<div class="two-col">' +
        '<section class="stack"><h2>The Six Conditions</h2>' + healthRows(snap.cond, { prev: prev.cond }) + '<p class="muted small">The thin mark shows where each condition stood at the start of this phase. The red line marks at risk.</p></section>' +
        '<section class="stack"><h2>The people</h2><div class="persona-list">' + people + '</div></section>' +
      '</div>' +
      (voices ? '<section class="stack"><h2>What people are saying</h2><div class="voices">' + voices + '</div>' +
        (snap.visible && snap.visible.sentiment ? '' : '<p class="muted small">Listening sessions and pulse surveys would let you hear more voices.</p>') + '</section>' : '') +
      (sigs ? '<section class="stack"><h2>What you\'re noticing</h2><ul class="signals">' + sigs + '</ul></section>' : '') +
      events +
      '<div class="stack"><p class="err" id="continue-err"></p><div class="actions"><button class="btn btn-primary" data-action="continue">' + esc(nextLabel) + '</button></div></div>' +
    '</main>';
  }

  /* ---------- month 18 ---------- */

  var M18_TEXT = {
    stuck: 'Nobody runs a campaign for the assistant anymore, and it doesn\'t need one. It has become part of how drafting gets done, and it survived the people who launched it moving on.',
    fragile: 'Most caseworkers still use it, but the support underneath is thin. The next reorganization or budget squeeze could undo it.',
    slipped: 'The launch worked. Then the program office closed, the reminders stopped, and the old way crept back in. Six months on, fewer people use the assistant than at its peak.',
    close: 'Real progress, but not enough to call it done. Some centers use the assistant well. Others never moved past trying it.',
    stalled: 'The assistant is live in every center and the login report looks fine. But for most caseworkers the work hasn\'t changed. Drafts are still written the old way.'
  };

  function m18Screen() {
    var g = ui.game, a = S.analyze(g);
    var H = g.history, m12 = H.filter(function (h) { return h.month === 12; })[0], m18 = H[H.length - 1];
    function mt(label, from, to) {
      var d = pct(to) - pct(from);
      return '<div class="m18-tile"><span class="muted small">' + label + '</span><span class="from">Month 12: ' + pct(from) + '%</span><span class="to num">' + pct(to) + '%</span>' +
        '<span class="chg ' + (d > 0 ? 'delta up' : d < 0 ? 'delta down' : 'delta flat') + '" style="text-align:left">' + (d > 0 ? '+' : '') + d + ' points since month 12</span></div>';
    }
    return '<main class="wrap screen">' +
      '<div class="phase-head"><p class="eyebrow">Month 18</p><h1 class="title" tabindex="-1">The program office closed six months ago.</h1>' +
      '<p class="lead">' + esc(M18_TEXT[a.tier]) + '</p></div>' +
      '<section class="stack"><h2>Six months later</h2><div class="m18-grid">' +
        mt('Meaningful use', m12.val, m18.val) + mt('Active use', m12.used, m18.used) + mt('Logins', m12.logins, m18.logins) +
      '</div></section>' +
      '<section class="stack"><h2>The Six Conditions without the program office</h2>' + healthRows(m18.cond, { prev: m12.cond }) +
      '<p class="muted small">The thin mark shows month 12. What you built into workflows, standards, and manager routines is what held.</p></section>' +
      '<div class="actions"><button class="btn btn-primary" data-action="to-debrief">See your debrief</button></div>' +
    '</main>';
  }

  /* ---------- debrief ---------- */

  function heatTable(g, upTo) {
    var rows = D.levers.filter(function (l) { return S.cum(g, l.id, upTo) > 0; });
    var head = '<tr><th>Lever</th>' + D.phases.slice(0, upTo).map(function (p) { return '<th>' + esc(p.name) + '</th>'; }).join('') + '<th style="text-align:right">Credits</th></tr>';
    var body = rows.map(function (l) {
      var tot = 0;
      var cells = D.phases.slice(0, upTo).map(function (p) {
        var lv = S.lvl(g, p.n, l.id);
        tot += lv * l.cost;
        return '<td><span class="lvl lvl-' + lv + '" title="' + esc(D.levelNames[lv]) + '">' + (lv ? D.levelNames[lv][0] : '') + '</span></td>';
      }).join('');
      return '<tr><td class="lname">' + esc(l.name) + '</td>' + cells + '<td class="tot">' + tot + '</td></tr>';
    }).join('');
    var foot = '<tr><th>Total</th>' + D.phases.slice(0, upTo).map(function (p) { return '<td>' + (g.spend[p.n] || 0) + '</td>'; }).join('') +
      '<td>' + D.phases.slice(0, upTo).reduce(function (t, p) { return t + (g.spend[p.n] || 0); }, 0) + '</td></tr>';
    var legend = '<div class="heat-legend"><span><i class="lvl-1"></i>Light</span><span><i class="lvl-2"></i>Moderate</span><span><i class="lvl-3"></i>Intensive</span></div>';
    if (!rows.length) return '<p class="muted">No activities yet.</p>';
    var cols = '<colgroup><col class="c-lever">' + D.phases.slice(0, upTo).map(function () { return '<col>'; }).join('') + '<col class="c-tot"></colgroup>';
    return '<div class="table-scroll"><table class="heat">' + cols + '<thead>' + head + '</thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table></div>' + legend;
  }

  function eventRecap(g) {
    var out = [];
    ['union', 'headline', 'win', 'sponsor'].forEach(function (id) {
      var e = g.events[id];
      if (!e) return;
      var ev = D.events[id];
      if (e.option === 'auto') { out.push('<li>' + esc(ev.resolvedTitle) + '<span>Because you engaged the union in Prepare</span></li>'); return; }
      var o = ev.options.filter(function (x) { return x.id === e.option; })[0];
      out.push('<li>' + esc(ev.title) + '<span>' + esc(o.label) + (o.cost ? ' (' + o.cost + ' ' + creditsWord(o.cost) + ')' : '') + '</span></li>');
    });
    if (g.frozen) out.push('<li>' + esc(D.events.cr.title) + '<span>' + g.frozen + ' credits frozen</span></li>');
    return out.join('');
  }

  function barRows(items, max) {
    return '<div class="barlist">' + items.map(function (it) {
      var w = max ? Math.round(it.value / max * 100) : 0;
      return '<div class="barrow"><span>' + esc(it.label) + '</span><div class="track" aria-hidden="true"><span class="fill" style="width:' + Math.max(it.value ? 2 : 0, w) + '%"></span></div><span class="bv">' + it.text + '</span></div>';
    }).join('') + '</div>';
  }

  function debriefScreen() {
    var g = ui.game, a = S.analyze(g);
    lastAnalysis = a;
    var tierCls = 'tier tier-' + a.tier;
    var condRows = D.conditions.map(function (c) {
      var v = a.cond18[c.id], st = a.condStart[c.id], weak = c.id === a.weakest;
      return '<div class="health-row"><div><div class="hn">' + esc(c.name) + (weak ? ' <span class="tag">Weakest</span>' : '') + '</div><div class="hq">' + esc(c.question) + '</div></div>' +
        '<div class="track" aria-hidden="true"><span class="riskline" style="left:' + D.riskLine + '%"></span><span class="fill" style="width:' + Math.max(1, Math.round(v)) + '%"></span><span class="ghost" style="left:' + Math.round(st) + '%"></span></div>' +
        '<div class="health-right"><span class="delta flat num" style="color:var(--ink-2)">' + Math.round(v) + '</span>' + healthChip(v) + '</div></div>';
    }).join('');

    var moveItems = D.moves.map(function (m) { return { label: m.name, value: a.byMove[m.id], text: a.byMove[m.id] + ' · ' + Math.round(a.share[m.id] * 100) + '%' }; });
    var maxMove = Math.max.apply(null, moveItems.map(function (x) { return x.value; }).concat([1]));
    var adTotal = a.adkar.A + a.adkar.D + a.adkar.K + a.adkar.B + a.adkar.R;
    var adItems = ['A', 'D', 'K', 'B', 'R'].map(function (k) { return { label: D.adkar[k], value: a.adkar[k], text: a.adkar[k] + ' · ' + (adTotal ? Math.round(a.adkar[k] / adTotal * 100) : 0) + '%' }; });
    var maxAd = Math.max.apply(null, adItems.map(function (x) { return x.value; }).concat([1]));
    var adSentence = a.akShare >= 0.55
      ? 'Like most AI programs, you spent most on Awareness and Knowledge (' + Math.round(a.akShare * 100) + '%) and less on Desire and Reinforcement (' + Math.round(a.drShare * 100) + '%), the two stages that decide whether AI sticks.'
      : a.drShare >= 0.45
        ? 'You put ' + Math.round(a.drShare * 100) + '% of your budget into Desire and Reinforcement, the two stages most AI programs starve.'
        : 'Your budget was spread across the ADKAR stages, with ' + Math.round(a.akShare * 100) + '% on Awareness and Knowledge and ' + Math.round(a.drShare * 100) + '% on Desire and Reinforcement.';

    var archRead = a.archetype.read;
    if (a.archetype.key === 'mixed') archRead = 'Your plan touched several moves, but ' + a.weakestName + ' never got strong enough to carry adoption. Adoption follows the weakest condition.';
    else if (a.success) archRead += ' It carried all six conditions past month 18.';

    var patterns = a.patterns.map(function (p) {
      return '<li class="' + (p.hit ? 'hit' : 'ok') + '">' + (p.hit ? ICON.warn : ICON.good) + '<div><div class="pt">' + esc(p.name) + '</div><div class="pd">' + esc(p.desc) + '</div><div class="pw">' + (p.hit ? esc(p.where) : 'Avoided') + '</div></div></li>';
    }).join('');

    var worked = a.worked.length ? a.worked.map(function (w) {
      return '<li>' + esc(w.name) + '<span>Most of its effect went to ' + esc(w.topName) + ' · ' + w.credits + ' credits</span></li>';
    }).join('') : '<li>Nothing stood out.<span>Try a plan with fewer, deeper activities.</span></li>';
    var leaks = a.leaks.length ? a.leaks.map(function (l) {
      var where = l.phases.map(function (n) { return phase(n).name; }).join(' and ');
      var why = l.kind === 'mistimed' ? 'Spent in a phase where it lands poorly: ' + where : 'Lost effect to overload, message fatigue, or sequencing: ' + where;
      return '<li>' + esc(l.name) + ' · about ' + Math.round(l.credits) + ' credits<span>' + esc(why) + '</span></li>';
    }).join('') : '<li>Nothing significant.<span>Your credits landed where they could work.</span></li>';

    var learn = a.learn.map(function (l) {

    var neverMeasured = S.cum(g, 'dashboard', 4) === 0;

    var r = ui.reflection;
    return '<main class="wrap screen">' +
      '<section class="outcome"><div class="outcome-main"><p class="eyebrow">Debrief</p><span class="' + tierCls + '">' + esc(a.title) + '</span>' +

      '</section>' +

      '<section class="stack"><div class="section-head"><h2>Adoption over 18 months</h2><p>Meaningful use is what counts. Logins are what most dashboards show.</p></div>' +
        '<div class="chart-legend"><span><i style="background:var(--s1)"></i>Meaningful use</span><span><i style="background:var(--s2)"></i>Active use</span><span><i style="background:var(--s3)"></i>Logins</span></div>' +
        '<div class="chart-box"><div class="chart" id="adopt-chart" role="img" aria-label="Line chart of meaningful use, active use, and logins from month 0 to month 18."></div></div>' +
        seriesTable +
